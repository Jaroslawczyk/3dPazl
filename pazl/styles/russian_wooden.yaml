id: russian_wooden
name: Russian wooden (izba)
name_ru: Русская деревянная (изба, терем)
era: 10th-20th c.
region: Russia
materials:
  wall: log_pine
  log: log_pine
  roof: shingles_wood
  trim: wood_carved
  frame: wood_painted_white
  gable: wood_boards
  plinth: stone_rubble
defaults:
  windows:
    trim: nalichnik
    shutters: true
    w: 0.8
    h: 1.0
  roof:
